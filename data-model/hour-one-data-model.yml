summary: >-
  Entity-relationship graph derived from the Hour One (MakeReals) OpenAPI schemas
  and id-reference fields. The central resource is a Video, assembled from Scenes
  and rendered against reusable Template / Palette / Character / Voice assets, with
  Webhooks delivering completion events.
entities:
- name: Video
  schema: VideoResponse
  id_field: id
