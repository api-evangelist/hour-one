name: Hour One
description: >-
  Hour One is a generative-AI video company (an Insight Partners portfolio company,
  acquired by Wix in 2025) whose Studio / MakeReals API turns text and templates into
  AI presenter ("virtual human") videos programmatically. The REST API lets developers
  create videos two ways — Blueprint (render from an existing Hour One project template)
  and Dynamic (define scenes, transcripts, characters and voices directly) — then poll or
  receive HMAC-signed webhooks (video.ready / video.failed) on completion, generate voice
  previews, add translated subtitles in 18 languages, pull per-scene metadata, and query a
  video-creation analytics summary. Authentication is an api-key header for the video
  surface and an HTTP Bearer token for account/key/webhook management.
